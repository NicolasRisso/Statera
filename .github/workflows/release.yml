name: Release

# Push a tag like v0.1.0 to build installers for all three OSes and publish a GitHub Release.
# "Run workflow" (manual) builds the same artifacts without publishing, as a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}
  ODIN_RELEASE: dev-2026-09

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@8d1159bdcd30261cf4536b7771d2bd98613ef418 # v2.9.1
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Dear ImGui
        shell: pwsh
        run: ./scripts/setup_imgui.ps1
      - name: Build Statera
        shell: pwsh
        run: ./scripts/build.ps1 -Release -Version $env:VERSION
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\windows\statera.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path build\statera.exe, build\SDL3.dll, LICENSE -DestinationPath "dist\Statera-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04 # older glibc = runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@8d1159bdcd30261cf4536b7771d2bd98613ef418 # v2.9.1
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev
      - name: Build SDL3
        run: sh scripts/build_sdl3.sh "$HOME/sdl3"
      - name: Build Dear ImGui
        run: sh scripts/setup_imgui.sh
      - name: Build Statera
        run: SDL_PREFIX="$HOME/sdl3" sh scripts/build.sh "$VERSION"
      - name: AppImage and .deb
        run: |
          curl -sSfL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          SDL_PREFIX="$HOME/sdl3" APPIMAGETOOL="$PWD/appimagetool" sh scripts/package_linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@8d1159bdcd30261cf4536b7771d2bd98613ef418 # v2.9.1
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDL3
        run: sh scripts/build_sdl3.sh "$HOME/sdl3"
      - name: Build Dear ImGui
        run: sh scripts/setup_imgui.sh
      - name: Build Statera
        run: SDL_PREFIX="$HOME/sdl3" sh scripts/build.sh "$VERSION"
      - name: App bundle and .dmg
        run: SDL_PREFIX="$HOME/sdl3" sh scripts/package_macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          sed "s/@VERSION@/$VERSION/g" installer/release-notes.md > notes.md
          echo '```' >> notes.md && cat dist/SHA256SUMS.txt >> notes.md && echo '```' >> notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Statera ${{ env.VERSION }}
          body_path: notes.md
          prerelease: true
          files: dist/*
