name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@8d1159bdcd30261cf4536b7771d2bd98613ef418 # v2.9.1
        with:
          release: dev-2026-09
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch ImGui bindings (pinned, same commit as scripts/setup_imgui.ps1)
        shell: bash
        run: |
          git clone --quiet https://gitlab.com/L-4/odin-imgui.git vendor/imgui
          git -C vendor/imgui checkout --quiet a116eb1ceaa6acde60219efdd56bf6c2e1aedf4c
      - name: Gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/gate.ps1
      - name: Gate (POSIX)
        if: runner.os != 'Windows'
        run: ./scripts/gate.sh
